<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Workshop for Code Migration / Upgrade</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-page">
  <main class="login-shell">
    <div class="login-mark">DEVIN WORKSHOP / CODE MIGRATION</div>
    <section class="login-card" aria-labelledby="login-title">
      <p class="kicker">PRIVATE REPORT</p>
      <h1 id="login-title">Workshop for Code Migration / Upgrade</h1>
      <p class="login-intro">Demo repository: PiggyMetrics</p>
      <p class="login-intro" lang="ja">デモリポジトリ: PiggyMetrics</p>
      {% if error %}
      <p class="form-error" role="alert">{{ error }}</p>
      {% endif %}
      <form method="post">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Open report <span aria-hidden="true">→</span></button>
      </form>
      <p class="login-footnote">Credentials are supplied by the report owner.</p>
      <div class="login-brand">
        <img src="{{ url_for('static', filename='img/softbank-logo.svg') }}" alt="SoftBank">
        <span>SoftBank</span>
      </div>
    </section>
  </main>
</body>
</html>
